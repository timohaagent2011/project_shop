{% extends 'base.html' %}
{% block title %}Добавить игру — GameStore{% endblock %}
{% block content %}
    <div class="form-card">
        <h1>Новая игра</h1>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="form-actions">
                <button type="submit" class="btn">Опубликовать</button>
            </div>
        </form>
    </div>
{% endblock %}
