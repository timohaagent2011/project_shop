{% extends 'base.html' %}
{% block title %}Вход — GameStore{% endblock %}
{% block content %}
    <div class="form-card">
        <h1>Вход</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="form-actions">
                <button type="submit" class="btn">Войти</button>
            </div>
        </form>
        <p style="text-align:center; margin-top: 16px; font-size: 0.9rem;">
            Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a>
        </p>
    </div>
{% endblock %}
